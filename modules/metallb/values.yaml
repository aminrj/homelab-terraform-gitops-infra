controller:
  priorityClassName: infra-critical
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

speaker:
  priorityClassName: infra-critical
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# L2 mode only (one pool, ARP). Chart 0.16 deploys frr-k8s (privileged BGP daemon) by default.
frrk8s:
  enabled: false
