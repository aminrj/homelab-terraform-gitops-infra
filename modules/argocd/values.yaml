# Reached as https://argocd.lab.aminrj.com through Traefik (TLS ends there, so the server
# itself speaks plain HTTP); the LoadBalancer IP stays as a fallback that needs no DNS.
configs:
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - argocd.lab.aminrj.com
    tls:
      - secretName: argocd-tls
        hosts:
          - argocd.lab.aminrj.com
  service:
    # type: ClusterIP
    type: LoadBalancer
    loadBalancerIP: "10.0.30.202"

