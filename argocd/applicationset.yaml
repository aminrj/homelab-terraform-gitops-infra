apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@github.com:aminrj/homelab-terraform-gitops-infra.git
        revision: main
        # Apps brought up on the MicroK8s cluster (2026-10-25), one line each: add an app
        # here once its database (db-applicationset.yaml) is restored and healthy.
        directories:
          - path: apps/n8n/overlays/prod
          - path: apps/commafeed/overlays/prod
          - path: apps/homepage/overlays/prod   # start page, no database
          - path: apps/pve-exporter/overlays/prod   # Proxmox metrics for Prometheus (read-only token)
          - path: apps/lab-dashboards/overlays/prod   # Grafana dashboards as code (Lab capacity)
          - path: apps/home-assistant/overlays/prod   # HTTPS in front of the Home Assistant VM
          - path: apps/gitea/overlays/prod   # git server for the personal assistant (homelab-foundation docs/assistant.md)
  template:
    metadata:
      name: '{{path[1]}}-{{path[3]}}' # example: commafeed-dev, listmonk-qa...
    spec:
      project: default #Add project separation later as needed
      source:
        repoURL: git@github.com:aminrj/homelab-terraform-gitops-infra.git
        targetRevision: main
        path: 'apps/{{path[1]}}/overlays/{{path[3]}}' #Example: apps/nextjs-app/dev
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path[3]}}' # dev, qa, prod as namespace (simpler - for now)
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
