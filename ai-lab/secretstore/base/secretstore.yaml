# ai-lab/secretstore/base/secretstore.yaml
# NAMESPACED SecretStore (not a ClusterSecretStore) — the linchpin of secret
# isolation. ExternalSecrets in ai-lab can resolve ONLY this store, scoped to a
# SEPARATE ai-lab Key Vault. There is no path from here to production secrets.
# Structure mirrors the working prod ClusterSecretStore (ServicePrincipal auth).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ai-lab-keyvault
  namespace: ai-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      environmentType: PublicCloud
      vaultUrl: "https://TODO-AILAB-KEYVAULT.vault.azure.net" # TODO(amine): separate ai-lab Key Vault URL
      tenantId: "TODO-TENANT-ID" # TODO(amine): Azure tenant id (prod uses 8052b405-...; confirm same tenant)
      authSecretRef:
        clientId:
          name: ai-lab-azure-sp   # TODO(amine): created by Terraform (ai-lab SP), key client-id
          key: client-id
        clientSecret:
          name: ai-lab-azure-sp
          key: client-secret
