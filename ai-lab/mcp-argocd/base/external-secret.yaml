# ai-lab/mcp-argocd/base/external-secret.yaml
# Argo CD read-only API token (local account holmes-readonly) from the ai-lab vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-mcp-token
  namespace: ai-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ai-lab-keyvault
    kind: SecretStore
  target:
    name: argocd-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: argocd-token
      remoteRef:
        key: argocd-mcp-readonly-token # TODO(amine): create in ai-lab Key Vault (token for the argocd holmes-readonly account)
