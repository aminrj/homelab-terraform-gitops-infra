# ai-lab/mcp-grafana/base/deployment.yaml
# grafana/mcp-grafana, read-only: Viewer-scoped token AND --disable-write.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: ai-lab
  labels:
    app: grafana-mcp
    mcp-server: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp
  template:
    metadata:
      labels:
        app: grafana-mcp
        mcp-server: "true"
    spec:
      automountServiceAccountToken: false   # MCP server never calls the K8s API
      containers:
        - name: grafana-mcp
          image: mcp/grafana:latest # TODO(amine): pin to a digest (mcp/grafana@sha256:...)
          args:
            - "--transport=streamable-http"
            - "--address=0.0.0.0:8000"
            - "--disable-write"            # remove write-capable tools entirely
          env:
            - name: GRAFANA_URL
              # Confirmed from modules/kube-prometheus-stack/outputs.tf
              value: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-token
                  key: grafana-token
          ports:
            - containerPort: 8000
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
