# ai-lab/mcp-grafana/base/external-secret.yaml
# Grafana service-account token (Viewer role) pulled from the ai-lab Key Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
  namespace: ai-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ai-lab-keyvault
    kind: SecretStore
  target:
    name: grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: grafana-token
      remoteRef:
        key: grafana-mcp-viewer-token # TODO(amine): create this secret in the ai-lab Key Vault (Grafana Viewer SA token)
