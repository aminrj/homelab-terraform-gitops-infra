# ai-lab/holmes/base/external-secret.yaml
# Holmes LLM API key from the ai-lab Key Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: holmes-llm-secret
  namespace: ai-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ai-lab-keyvault
    kind: SecretStore
  target:
    name: holmes-llm-secret
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: holmes-anthropic-api-key # TODO(amine): create in the ai-lab Key Vault
