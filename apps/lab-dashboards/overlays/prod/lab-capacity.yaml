# Grafana dashboard "Lab capacity" (bar gauges), loaded by Grafana's dashboard sidecar and
# embedded at the top of Homepage. Queries: pve-exporter (Proxmox) and node-exporter (k8s VMs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-capacity-dashboard
  labels:
    grafana_dashboard: '1'
data:
  lab-capacity.json: "{\n \"uid\": \"lab-capacity\",\n \"title\": \"Lab capacity\",\n \"tags\": [\n  \"homelab\",\n  \"capacity\"\n ],\n \"timezone\": \"browser\",\n \"refresh\": \"1m\",\n \"schemaVersion\"\
    : 39,\n \"editable\": false,\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"panels\": [\n  {\n   \"id\": 1,\n   \"type\": \"bargauge\",\n   \"title\": \"Proxmox storage used\",\n\
    \   \"transparent\": true,\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 10,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n \
    \  },\n   \"options\": {\n    \"displayMode\": \"lcd\",\n    \"orientation\": \"horizontal\",\n    \"showUnfilled\": true,\n    \"valueMode\": \"color\",\n    \"namePlacement\": \"left\",\n    \"sizing\"\
    : \"auto\",\n    \"minVizHeight\": 14,\n    \"maxVizHeight\": 22,\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    }\n\
    \   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percent\",\n     \"min\": 0,\n     \"max\": 100,\n     \"decimals\": 0,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n\
    \      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 70\n       },\n       {\n        \"color\"\
    : \"red\",\n        \"value\": 85\n       }\n      ]\n     },\n     \"color\": {\n      \"mode\": \"thresholds\"\n     }\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\"\
    : \"label_replace(100 * pve_disk_usage_bytes{id=~\\\"storage/.*\\\"} / (pve_disk_size_bytes{id=~\\\"storage/.*\\\"} > 0), \\\"pool\\\", \\\"$1\\\", \\\"id\\\", \\\"storage/[^/]+/(.*)\\\")\",\n     \"\
    legendFormat\": \"{{instance}} \\u00b7 {{pool}}\",\n     \"refId\": \"A\",\n     \"instant\": true,\n     \"range\": false\n    }\n   ]\n  },\n  {\n   \"id\": 2,\n   \"type\": \"bargauge\",\n   \"title\"\
    : \"Proxmox hosts\",\n   \"transparent\": true,\n   \"gridPos\": {\n    \"x\": 10,\n    \"y\": 0,\n    \"w\": 7,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\"\
    : \"prometheus\"\n   },\n   \"options\": {\n    \"displayMode\": \"lcd\",\n    \"orientation\": \"horizontal\",\n    \"showUnfilled\": true,\n    \"valueMode\": \"color\",\n    \"namePlacement\": \"\
    left\",\n    \"sizing\": \"auto\",\n    \"minVizHeight\": 14,\n    \"maxVizHeight\": 22,\n    \"reduceOptions\": {\n     \"calcs\": [\n      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"\
    values\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percent\",\n     \"min\": 0,\n     \"max\": 100,\n     \"decimals\": 0,\n     \"thresholds\": {\n      \"\
    mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n        \"color\": \"orange\",\n        \"value\": 70\n       },\n \
    \      {\n        \"color\": \"red\",\n        \"value\": 85\n       }\n      ]\n     },\n     \"color\": {\n      \"mode\": \"thresholds\"\n     }\n    },\n    \"overrides\": []\n   },\n   \"targets\"\
    : [\n    {\n     \"expr\": \"label_replace(100 * pve_cpu_usage_ratio{id=~\\\"node/.*\\\"}, \\\"what\\\", \\\"CPU\\\", \\\"\\\", \\\"\\\")\",\n     \"legendFormat\": \"{{instance}} \\u00b7 CPU\",\n \
    \    \"refId\": \"A\",\n     \"instant\": true,\n     \"range\": false\n    },\n    {\n     \"expr\": \"label_replace(100 * pve_memory_usage_bytes{id=~\\\"node/.*\\\"} / pve_memory_size_bytes{id=~\\\
    \"node/.*\\\"}, \\\"what\\\", \\\"Memory\\\", \\\"\\\", \\\"\\\")\",\n     \"legendFormat\": \"{{instance}} \\u00b7 memory\",\n     \"refId\": \"B\",\n     \"instant\": true,\n     \"range\": false\n\
    \    }\n   ]\n  },\n  {\n   \"id\": 3,\n   \"type\": \"bargauge\",\n   \"title\": \"k8s VMs\",\n   \"transparent\": true,\n   \"gridPos\": {\n    \"x\": 17,\n    \"y\": 0,\n    \"w\": 7,\n    \"h\"\
    : 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"options\": {\n    \"displayMode\": \"lcd\",\n    \"orientation\": \"horizontal\",\n    \"showUnfilled\"\
    : true,\n    \"valueMode\": \"color\",\n    \"namePlacement\": \"left\",\n    \"sizing\": \"auto\",\n    \"minVizHeight\": 14,\n    \"maxVizHeight\": 22,\n    \"reduceOptions\": {\n     \"calcs\": [\n\
    \      \"lastNotNull\"\n     ],\n     \"fields\": \"\",\n     \"values\": false\n    }\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percent\",\n     \"min\": 0,\n     \"max\"\
    : 100,\n     \"decimals\": 0,\n     \"thresholds\": {\n      \"mode\": \"absolute\",\n      \"steps\": [\n       {\n        \"color\": \"green\",\n        \"value\": null\n       },\n       {\n    \
    \    \"color\": \"orange\",\n        \"value\": 70\n       },\n       {\n        \"color\": \"red\",\n        \"value\": 85\n       }\n      ]\n     },\n     \"color\": {\n      \"mode\": \"thresholds\"\
    \n     }\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"label_replace(100 - 100 * node_filesystem_avail_bytes{mountpoint=\\\"/\\\"} / node_filesystem_size_bytes{mountpoint=\\\
    \"/\\\"}, \\\"node\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+).*\\\")\",\n     \"legendFormat\": \"{{node}} \\u00b7 disk\",\n     \"refId\": \"A\",\n     \"instant\": true,\n     \"range\": false\n\
    \    },\n    {\n     \"expr\": \"100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)\",\n     \"legendFormat\": \"{{instance}} \\u00b7 memory\",\n     \"refId\": \"B\",\n     \"\
    instant\": true,\n     \"range\": false\n    }\n   ]\n  }\n ]\n}"
