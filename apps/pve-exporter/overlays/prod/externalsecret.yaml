# pve.yml for the exporter: one module per Proxmox API, token values from Key Vault
# (homelab-foundation `scripts/pve-monitor-token.sh cluster|appliance|node2`). Self-signed certs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-prod
    kind: ClusterSecretStore
  target:
    name: pve-exporter-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        pve.yml: |
          cluster:
            user: prometheus@pve
            token_name: exporter
            token_value: "{{ .cluster }}"
            verify_ssl: false
          appliance:
            user: prometheus@pve
            token_name: exporter
            token_value: "{{ .appliance }}"
            verify_ssl: false
          node2:
            user: prometheus@pve
            token_name: exporter
            token_value: "{{ .node2 }}"
            verify_ssl: false
  data:
    - secretKey: cluster
      remoteRef: { key: foundation-pve-cluster-monitor-token }
    - secretKey: appliance
      remoteRef: { key: foundation-pve-appliance-monitor-token }
    - secretKey: node2
      remoteRef: { key: foundation-pve-node2-monitor-token }
