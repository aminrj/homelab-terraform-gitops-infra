# One scrape per Proxmox API (multi-target: the exporter asks the host given in `target`,
# with the token of `module`). Addresses: homelab-foundation inventory, proxmox.*.mgmt_ip.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
spec:
  selector:
    matchLabels: { app: pve-exporter }
  endpoints:
    - port: http
      path: /pve
      interval: 60s
      scrapeTimeout: 30s
      params: { target: ["10.0.0.5"], module: ["cluster"], cluster: ["1"], node: ["1"] }
      relabelings:
        - { targetLabel: instance, replacement: proxmox-node-5 }
    - port: http
      path: /pve
      interval: 60s
      scrapeTimeout: 30s
      params: { target: ["10.0.0.3"], module: ["appliance"], cluster: ["1"], node: ["1"] }
      relabelings:
        - { targetLabel: instance, replacement: proxmox-node-1 }
