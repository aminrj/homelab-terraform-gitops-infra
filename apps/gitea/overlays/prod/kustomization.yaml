# Gitea: the git server the personal assistant writes to (branches and pull requests only),
# homelab-foundation docs/assistant.md. Database: databases/gitea (CNPG).
resources:
  - ../../base
  - secrets.yaml
  - ingress.yaml
  - namespace.yaml
  - offsite.yaml

namespace: gitea-prod

patches:
  - target:
      kind: PersistentVolumeClaim
      name: gitea-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: microk8s-hostpath
