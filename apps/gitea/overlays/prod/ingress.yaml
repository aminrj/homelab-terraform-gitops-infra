# Private: gitea.lab.aminrj.com resolves to the ingress VIP through OPNsense's split DNS (in the
# lab and over Tailscale); nothing is published. Certificate: Let's Encrypt via DNS-01.
# Clients: you (browser, git over HTTPS), the assistant VMs (homelab-foundation docs/assistant.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gitea.lab.aminrj.com
      secretName: gitea-tls
  rules:
    - host: gitea.lab.aminrj.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-http
                port:
                  number: 80
