apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.5.0 # pinned; releases weekly, bump deliberately
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Hosts Homepage answers for: the pod IP (probes) and its name (overlay adds it).
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000"
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml }
            - { name: config, mountPath: /app/config/services.yaml, subPath: services.yaml }
            - { name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml }
            - { name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml }
            - { name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
            - { name: config, mountPath: /app/config/docker.yaml, subPath: docker.yaml }
            - { name: config, mountPath: /app/config/proxmox.yaml, subPath: proxmox.yaml }
            - { name: config, mountPath: /app/config/custom.css, subPath: custom.css }
            - { name: config, mountPath: /app/config/custom.js, subPath: custom.js }
            - { name: logs, mountPath: /app/config/logs }
            - { name: cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: homepage
        - { name: logs, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
