# One entry per service; keep in line with homelab-foundation docs/services.md.
# Status: podSelector = the pods' state from Kubernetes, siteMonitor = an HTTP check from inside
# the cluster, showStats = the pods' CPU and memory (metrics-server). Hosts on MGMT have links
# only: SERVICES can't reach MGMT (by design). Proxmox figures come from Prometheus (apps/pve-exporter).
- At a glance:
    - Lab health:
        description: From Prometheus; details in Grafana
        icon: mdi-heart-pulse
        href: https://grafana.lab.aminrj.com
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 60000
          metrics:
            - label: Alerts firing
              query: count(ALERTS{alertstate="firing",alertname!="Watchdog"}) or vector(0)
            - label: k8s nodes ready
              query: sum(kube_node_status_condition{condition="Ready",status="true"})
            - label: Fullest k8s disk
              query: max(100 - 100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
              format: { type: percent, options: { maximumFractionDigits: 0 } }
            - label: DB backup age
              query: max((time() - max by (job) (cnpg_collector_last_available_backup_timestamp)) / 3600)
              format: { type: number, suffix: " h", options: { maximumFractionDigits: 1 } }
          highlight:
            Fullest k8s disk:
              numeric:
                - { level: danger, when: gte, value: 85 }
                - { level: warn, when: gte, value: 70 }
                - { level: good, when: lt, value: 70 }
            Alerts firing:
              numeric:
                - { level: danger, when: gte, value: 1 }
                - { level: good, when: eq, value: 0 }
    - Certificates and backups:
        description: Soonest certificate renewal, VMs without a backup job
        icon: mdi-shield-check-outline
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 300000
          metrics:
            - label: Cert expiry
              query: min(certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
              format: { type: number, suffix: " d", options: { maximumFractionDigits: 0 } }
            - label: Certificates
              query: count(certmanager_certificate_ready_status{condition="True"} == 1)
            - label: VMs without backup
              # k8s VMs are rebuilt from code and templates need none: not counted
              query: count(pve_not_backed_up_info * on(id, instance) group_left(name) pve_guest_info{template="0",name!~"k8s-.*"}) or vector(0)

- Proxmox:
    - node-5:
        href: https://10.0.0.5:8006
        description: k8s-1..3 (standalone cluster of one)
        icon: proxmox.png
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 60000
          metrics:
            - label: CPU
              query: 100 * pve_cpu_usage_ratio{instance="proxmox-node-5",id=~"node/.*"}
              format: { type: percent, options: { maximumFractionDigits: 0 } }
            - label: Memory
              query: 100 * pve_memory_usage_bytes{instance="proxmox-node-5",id=~"node/.*"} / pve_memory_size_bytes{instance="proxmox-node-5",id=~"node/.*"}
              format: { type: percent, options: { maximumFractionDigits: 0 } }
            - label: VMs running
              query: count(pve_up{instance="proxmox-node-5",id=~"qemu/.*"} == 1) or vector(0)
            - label: Uptime
              query: pve_uptime_seconds{instance="proxmox-node-5",id=~"node/.*"} / 86400
              format: { type: number, suffix: " d", options: { maximumFractionDigits: 0 } }
          highlight:
            CPU:
              numeric:
                - { level: danger, when: gte, value: 85 }
                - { level: warn, when: gte, value: 70 }
                - { level: good, when: lt, value: 70 }
            Memory:
              numeric:
                - { level: danger, when: gte, value: 85 }
                - { level: warn, when: gte, value: 70 }
                - { level: good, when: lt, value: 70 }
