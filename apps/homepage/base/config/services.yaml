# Every VM, from the Proxmox exporter (queries by VM id, so a card follows its VM to another
# host). "RAM used" is measured inside the k8s VMs; "RAM (host)" is Proxmox's figure, which counts
# the guest's file cache. "Sent 24 h": what the VM pushed onto the network (the assistant's Inside
# agent should only talk to the model, Gitea and its bridges).
- VMs:
    - OPNsense:
        description: VM 110 · appliance · 4 GB · firewall, DNS, DHCP
        icon: opnsense.png
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 60000
          metrics:
            - label: CPU
              query: 100 * pve_cpu_usage_ratio{id="qemu/110"}
              format: { type: percent, options: { maximumFractionDigits: 0 } }
            - label: RAM (host)
              # Proxmox's view: includes the guest's file cache, so real use is lower
              query: pve_memory_usage_bytes{id="qemu/110"}
              format: { type: bytes }
            - label: Sent 24 h
              query: increase(pve_network_transmit_bytes_total{id="qemu/110"}[24h])
              format: { type: bytes }
            - label: Uptime
              # 0 when the VM is stopped (the series disappears)
              query: max(pve_uptime_seconds{id="qemu/110"} / 86400) or vector(0)
              format: { type: number, suffix: " d", options: { maximumFractionDigits: 1 } }
          highlight:
            CPU:
              numeric:
                - { level: danger, when: gte, value: 85 }
                - { level: warn, when: gte, value: 70 }
                - { level: good, when: lt, value: 70 }
            Uptime:
              numeric:
                - { level: danger, when: eq, value: 0 }
                - { level: good, when: gt, value: 0 }
