# One entry per service; keep in line with homelab-foundation docs/services.md.
# Status: podSelector = the pods' state from Kubernetes, siteMonitor = an HTTP check from inside
# the cluster. Infrastructure on MGMT has links only: SERVICES can't reach MGMT (by design).
- Apps:
    - n8n:
        href: https://n8n.lab.aminrj.com
        description: Automation
        icon: n8n.png
        namespace: n8n-prod
        podSelector: app=n8n
        siteMonitor: http://n8n.n8n-prod.svc.cluster.local
    - CommaFeed:
        href: https://commafeed.lab.aminrj.com
        description: RSS reader
        icon: commafeed.png
        namespace: commafeed-prod
        podSelector: app=commafeed
        siteMonitor: http://commafeed.commafeed-prod.svc.cluster.local
    - Home Assistant:
        href: http://ha.lab.aminrj.com:8123
        description: Home automation (VM 112 on the appliance)
        icon: home-assistant.png
        siteMonitor: http://10.0.30.40:8123

- Platform:
    - ArgoCD:
        href: https://argocd.lab.aminrj.com
        description: What runs on the cluster (GitOps)
        icon: argo-cd.png
        namespace: argocd
        podSelector: app.kubernetes.io/name=argocd-server
        siteMonitor: http://argocd-server.argocd.svc.cluster.local
    - Grafana:
        href: https://grafana.lab.aminrj.com
        description: Dashboards
        icon: grafana.png
        namespace: monitoring
        podSelector: app.kubernetes.io/name=grafana
        siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
    - Prometheus:
        description: Metrics and alerts (kubectl port-forward, docs/services.md)
        icon: prometheus.png
        namespace: monitoring
        podSelector: app.kubernetes.io/name=prometheus
        widget:
          type: prometheus
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    - Traefik:
        description: Ingress on 10.0.30.200
        icon: traefik.png
        namespace: traefik
        podSelector: app.kubernetes.io/name=traefik

- Infrastructure:
    - OPNsense:
        href: https://10.0.0.1
        description: Firewall, DHCP, DNS (root + TOTP)
        icon: opnsense.png
    - Proxmox appliance:
        href: https://192.168.0.220:8006
        description: OPNsense and Home Assistant
        icon: proxmox.png
    - Proxmox node-5:
        href: https://10.0.0.5:8006
        description: k8s-1..3, milo
        icon: proxmox.png
