# One entry per service; keep in line with homelab-foundation docs/services.md.
# Status: podSelector = the pods' state from Kubernetes, siteMonitor = an HTTP check from inside
# the cluster, showStats = the pods' CPU and memory (metrics-server). Hosts on MGMT have links
# only: SERVICES can't reach MGMT (by design).
- Apps:
    - n8n:
        href: https://n8n.lab.aminrj.com
        description: Workflow automation
        icon: n8n.png
        namespace: n8n-prod
        podSelector: app=n8n
        siteMonitor: http://n8n.n8n-prod.svc.cluster.local
        showStats: true
    - CommaFeed:
        href: https://commafeed.lab.aminrj.com
        description: RSS reader
        icon: commafeed.png
        namespace: commafeed-prod
        podSelector: app=commafeed
        siteMonitor: http://commafeed.commafeed-prod.svc.cluster.local
        showStats: true
    - Home Assistant:
        href: http://ha.lab.aminrj.com:8123
        description: Home automation, VM 112 on the appliance
        icon: home-assistant.png
        siteMonitor: http://10.0.30.40:8123

- Monitoring:
    - Grafana:
        href: https://grafana.lab.aminrj.com
        description: Dashboards
        icon: grafana.png
        namespace: monitoring
        podSelector: app.kubernetes.io/name=grafana
        siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
    - Prometheus:
        description: Metrics (kubectl port-forward, docs/services.md)
        icon: prometheus.png
        namespace: monitoring
        podSelector: app.kubernetes.io/name=prometheus
        widget:
          type: prometheus
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    - Alertmanager:
        description: Alert routing
        icon: alertmanager.png
        namespace: monitoring
        podSelector: app.kubernetes.io/name=alertmanager
        siteMonitor: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093

- Platform:
    - ArgoCD:
        href: https://argocd.lab.aminrj.com
        description: GitOps, syncs the GitOps repo
        icon: argo-cd.png
        namespace: argocd
        podSelector: app.kubernetes.io/name=argocd-server
        siteMonitor: http://argocd-server.argocd.svc.cluster.local
    - Traefik:
        description: Ingress on 10.0.30.200
        icon: traefik.png
        namespace: traefik
        podSelector: app.kubernetes.io/name=traefik
    - cert-manager:
        description: Let's Encrypt certificates (DNS-01)
        icon: cert-manager.png
        namespace: cert-manager
        podSelector: app.kubernetes.io/instance=cert-manager
    - External Secrets:
        description: Secrets from Azure Key Vault
        icon: mdi-key-chain-variant
        namespace: external-secrets
        podSelector: app.kubernetes.io/instance=external-secrets
    - CloudNativePG:
        description: Postgres for n8n and CommaFeed, backups to Azure
        icon: postgresql.png
        namespace: cnpg-prod
        podSelector: cnpg.io/podRole=instance
    - MetalLB:
        description: LoadBalancer addresses 10.0.30.200-220
        icon: metallb.png
        namespace: metallb-system
        podSelector: app.kubernetes.io/name=metallb

- Network and hosts:
    - OPNsense:
        href: https://10.0.0.1
        description: Firewall, DHCP, DNS (TOTP)
        icon: opnsense.png
    - Proxmox appliance:
        href: https://192.168.0.220:8006
        description: OPNsense and Home Assistant (TOTP)
        icon: proxmox.png
    - Proxmox node-5:
        href: https://10.0.0.5:8006
        description: k8s-1..3, milo (TOTP)
        icon: proxmox.png
    - Tailscale:
        href: https://login.tailscale.com/admin/machines
        description: Remote access, OPNsense is the lab router
        icon: tailscale.png
