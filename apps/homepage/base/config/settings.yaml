# Homepage settings (https://gethomepage.dev/configs/settings/). Changing any file in config/
# rolls the pod: kustomize's configMapGenerator gives the ConfigMap a new name.
title: Homelab
description: Private lab behind OPNsense, reached over Tailscale
theme: dark
color: slate
headerStyle: boxedWidgets
statusStyle: dot
hideVersion: true
cardBlur: md
useEqualHeights: true
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true
# Group order and look (icons: https://pictogrammers.com/library/mdi/).
layout:
  At a glance:
    style: row
    columns: 2
    icon: mdi-gauge
  Capacity:
    style: row
    columns: 1
    icon: mdi-chart-bar
  Apps:
    style: row
    columns: 3
    icon: mdi-apps
  Monitoring:
    style: row
    columns: 3
    icon: mdi-chart-timeline-variant
  Platform:
    style: row
    columns: 3
    icon: mdi-kubernetes
  Hosts and network:
    style: row
    columns: 4
    icon: mdi-server-network
