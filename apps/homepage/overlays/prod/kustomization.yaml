namespace: homepage

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

patches:
  - target:
      kind: Deployment
      name: homepage
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "$(MY_POD_IP):3000,homepage.lab.aminrj.com"
