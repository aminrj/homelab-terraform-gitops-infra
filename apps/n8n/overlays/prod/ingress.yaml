# Private: n8n.lab.aminrj.com resolves to the ingress VIP through OPNsense's split DNS (in the
# lab and over Tailscale); nothing is published. Certificate: Let's Encrypt via DNS-01.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - n8n.lab.aminrj.com
      secretName: n8n-tls
  rules:
    - host: n8n.lab.aminrj.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 80
