apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-db-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-prod
    kind: ClusterSecretStore
  target:
    name: gitea-db-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: gitea-db-username
    - secretKey: password
      remoteRef:
        key: gitea-db-password
    - secretKey: database
      remoteRef:
        key: gitea-db-name

---
# Storage account name plus the foundation's no-delete SAS (homelab-foundation terraform/azure).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-db-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-prod
    kind: ClusterSecretStore
  target:
    name: gitea-db-storage
    creationPolicy: Owner
    template:
      data:
        storage-account: hlabpvebknwkqcj
        blob-sas: "{{ .sas }}"
  data:
    - secretKey: sas
      remoteRef:
        key: foundation-backup-sas
